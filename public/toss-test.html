<!doctype html>
<!--
  결제 진단 전용 테스트 페이지. Laravel 로그인/세션과 완전히 무관하게,
  현재 접속한 도메인(origin)이 토스 결제창에서 successUrl로 받아들여지는지만 확인합니다.
  같은 파일을 http://yeonbun.test/toss-test.html 로 열었을 때와
  https://xxxx.ngrok-free.dev/toss-test.html 로 열었을 때를 비교해보세요.
  진단이 끝나면 이 파일은 지워도 됩니다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>토스 결제 진단</title>
  <script src="https://js.tosspayments.com/v1/payment"></script>
</head>
<body style="font-family: sans-serif; padding: 24px;">
  <h2>토스 결제창 진단 페이지</h2>
  <p>현재 페이지 주소: <code id="origin"></code></p>
  <p>여기서 쓸 successUrl: <code id="success-url"></code></p>

  <label>클라이언트 키 (test_ck_...): <br>
    <input id="client-key" style="width:420px" value="여기에_TOSS_CLIENT_KEY_붙여넣기">
  </label>
  <br><br>
  <button id="go">결제창 띄우기 (10,000원 테스트)</button>

  <pre id="log" style="background:#f4f4f4; padding:12px; margin-top:16px; white-space:pre-wrap;"></pre>

  <script>
    var origin = window.location.origin;
    document.getElementById('origin').textContent = origin;
    var successUrl = origin + '/toss-test.html?result=success';
    var failUrl = origin + '/toss-test.html?result=fail';
    document.getElementById('success-url').textContent = successUrl;

    function log(msg) {
      document.getElementById('log').textContent += msg + '\n';
    }

    var params = new URLSearchParams(window.location.search);
    if (params.get('result')) {
      log('돌아온 파라미터: ' + window.location.search);
    }

    document.getElementById('go').addEventListener('click', function () {
      var clientKey = document.getElementById('client-key').value.trim();
      if (!clientKey) { log('클라이언트 키를 입력하세요.'); return; }

      var tossPayments = TossPayments(clientKey);
      var orderId = 'diag' + Date.now();

      log('요청 시작: orderId=' + orderId + ', successUrl=' + successUrl);

      tossPayments.requestPayment('카드', {
        amount: 10000,
        orderId: orderId,
        orderName: '진단용 테스트',
        successUrl: successUrl,
        failUrl: failUrl
      }).catch(function (error) {
        log('에러: ' + JSON.stringify(error));
      });
    });
  </script>
</body>
</html>
